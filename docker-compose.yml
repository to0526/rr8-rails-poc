# このPoC用のローカル開発環境。`docker-compose up` だけで
# frontend(Vite dev server) / backend(Rails) / db(MySQL) の3つが起動する状態を目指す。
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      # ホスト側で既に3306番が使われている場合(ローカルにMySQLが入っている等)は、
      # .envに DB_PORT=3307 のように設定すれば競合を避けられる
      # (コンテナ間の接続はサービス名 "db" 経由で行うため、backend側の設定変更は不要)
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    # backendがdb起動前に接続しようとして失敗しないよう、
    # MySQLが実際に接続を受け付けられる状態になるまで待つ
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # docker-compose内ではサービス名がそのままホスト名になるため "db" を指定
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/rails
    # db:prepare でDB作成・マイグレーションを済ませ、db:seed で一覧画面確認用のデータを
    # 投入してからサーバーを起動する(db:seedはfind_or_create_by!で冪等にしてあるため
    # 毎回実行しても問題ない)
    # (手動で `docker-compose exec backend bin/rails db:create` 等を叩かなくて良いようにするため)
    command: ["sh", "-c", "bin/rails db:prepare && bin/rails db:seed && bin/rails server -b 0.0.0.0 -p 3000"]

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # ホスト側にnode_modulesが無くても、コンテナ内でインストール済みのnode_modulesを
      # 上書きしないようにするためのおまじない(無名ボリューム)
      - /app/node_modules
    depends_on:
      - backend

  # PR19: 本番相当ビルド(react-router build → react-router-serve での配信)を
  # ローカルで試すための検証用サービス。`vite dev` のSSRは開発用の挙動であり、
  # 本番ビルド後の挙動とは異なるため、SEO効果をより正確に検証する目的で追加する。
  # あくまでローカル検証用であり、本番デプロイ設定(ECS Fargate等)ではない。
  #
  # 通常の `docker-compose up` には含めず、
  # `docker-compose --profile prod up frontend-prod` のように明示的に指定した
  # ときだけ起動する(opt-in)。ビルド済みの成果物をそのまま動かす検証のため、
  # frontend(dev)と違いソースをvolumeマウントしない。
  frontend-prod:
    build:
      context: ./frontend
      target: prod
    profiles:
      - prod
    env_file:
      - .env
    ports:
      - "4000:3000"
    depends_on:
      - backend

volumes:
  db_data:
